<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1096 438" role="img" aria-label="Complete business workflow"><title>Complete business workflow</title><defs><marker id="arrow0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#727989"/></marker></defs><path d="M258,70 L284,70" fill="none" stroke="#727989" stroke-width="2" marker-end="url(#arrow0)"/><path d="M522,70 L548,70" fill="none" stroke="#727989" stroke-width="2" marker-end="url(#arrow0)"/><path d="M786,70 L812,70" fill="none" stroke="#727989" stroke-width="2" marker-end="url(#arrow0)"/><path d="M931,118 V137.0 H931 V156" fill="none" stroke="#727989" stroke-width="2" marker-end="url(#arrow0)"/><path d="M812,204 L786,204" fill="none" stroke="#727989" stroke-width="2" marker-end="url(#arrow0)"/><path d="M548,204 L522,204" fill="none" stroke="#727989" stroke-width="2" marker-end="url(#arrow0)"/><path d="M284,204 L258,204" fill="none" stroke="#727989" stroke-width="2" marker-end="url(#arrow0)"/><path d="M139,252 V271.0 H139 V290" fill="none" stroke="#727989" stroke-width="2" marker-end="url(#arrow0)"/><path d="M258,338 L284,338" fill="none" stroke="#727989" stroke-width="2" marker-end="url(#arrow0)"/><path d="M522,338 L548,338" fill="none" stroke="#727989" stroke-width="2" marker-end="url(#arrow0)"/><path d="M786,338 L812,338" fill="none" stroke="#727989" stroke-width="2" marker-end="url(#arrow0)"/><rect x="20" y="22" width="238" height="96" rx="15" fill="#fff3b0" stroke="#d9dde5"/><text x="35" y="52" fill="#17212e" font-family="Arial,sans-serif" font-size="14" font-weight="600"><tspan x="35" dy="0">1. Account, role and team</tspan><tspan x="35" dy="19">setup</tspan></text><rect x="284" y="22" width="238" height="96" rx="15" fill="#fff3b0" stroke="#d9dde5"/><text x="299" y="52" fill="#17212e" font-family="Arial,sans-serif" font-size="14" font-weight="600"><tspan x="299" dy="0">2. Sign in to permitted</tspan><tspan x="299" dy="19">pages</tspan></text><rect x="548" y="22" width="238" height="96" rx="15" fill="#fff3b0" stroke="#d9dde5"/><text x="563" y="52" fill="#17212e" font-family="Arial,sans-serif" font-size="14" font-weight="600"><tspan x="563" dy="0">3. Select client; create</tspan><tspan x="563" dy="19">project</tspan></text><rect x="812" y="22" width="238" height="96" rx="15" fill="#fff3b0" stroke="#d9dde5"/><text x="827" y="52" fill="#17212e" font-family="Arial,sans-serif" font-size="14" font-weight="600"><tspan x="827" dy="0">4. Set rate, teams and</tspan><tspan x="827" dy="19">coordinator</tspan></text><rect x="812" y="156" width="238" height="96" rx="15" fill="#ffffff" stroke="#d9dde5"/><text x="827" y="186" fill="#17212e" font-family="Arial,sans-serif" font-size="14" font-weight="600"><tspan x="827" dy="0">5. Create tasks; agree</tspan><tspan x="827" dy="19">commitment</tspan></text><rect x="548" y="156" width="238" height="96" rx="15" fill="#ffffff" stroke="#d9dde5"/><text x="563" y="186" fill="#17212e" font-family="Arial,sans-serif" font-size="14" font-weight="600"><tspan x="563" dy="0">6. Assign eligible person</tspan></text><rect x="284" y="156" width="238" height="96" rx="15" fill="#ffffff" stroke="#d9dde5"/><text x="299" y="186" fill="#17212e" font-family="Arial,sans-serif" font-size="14" font-weight="600"><tspan x="299" dy="0">7. Accept task; start work</tspan><tspan x="299" dy="19">timer</tspan></text><rect x="20" y="156" width="238" height="96" rx="15" fill="#ffffff" stroke="#d9dde5"/><text x="35" y="186" fill="#17212e" font-family="Arial,sans-serif" font-size="14" font-weight="600"><tspan x="35" dy="0">8. Pause breaks; resume work</tspan></text><rect x="20" y="290" width="238" height="96" rx="15" fill="#ffffff" stroke="#d9dde5"/><text x="35" y="320" fill="#17212e" font-family="Arial,sans-serif" font-size="14" font-weight="600"><tspan x="35" dy="0">9. Submit assignment for</tspan><tspan x="35" dy="19">review</tspan></text><rect x="284" y="290" width="238" height="96" rx="15" fill="#ffffff" stroke="#d9dde5"/><text x="299" y="320" fill="#17212e" font-family="Arial,sans-serif" font-size="14" font-weight="600"><tspan x="299" dy="0">10. Coordinator and client</tspan><tspan x="299" dy="19">review</tspan></text><rect x="548" y="290" width="238" height="96" rx="15" fill="#ffffff" stroke="#d9dde5"/><text x="563" y="320" fill="#17212e" font-family="Arial,sans-serif" font-size="14" font-weight="600"><tspan x="563" dy="0">11. Mark project completed</tspan></text><rect x="812" y="290" width="238" height="96" rx="15" fill="#ffffff" stroke="#d9dde5"/><text x="827" y="320" fill="#17212e" font-family="Arial,sans-serif" font-size="14" font-weight="600"><tspan x="827" dy="0">12. Sales, credits and</tspan><tspan x="827" dy="19">reports</tspan></text></svg>